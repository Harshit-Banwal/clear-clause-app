spring:
  application:
    name: Employment Agreement Scan

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/easDB}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-2.0-flash

openrouter:
  api-key: ${OPENROUTER_API_KEY}
  model: openrouter/free
